<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Planner</title>
    <link rel="stylesheet" href="student-planner.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1><i class="fas fa-graduation-cap"></i> Student Planner</h1>
            <div class="header-actions">
                <button class="btn btn-primary" onclick="exportData()">
                    <i class="fas fa-download"></i> Export
                </button>
                <button class="btn btn-secondary" onclick="importData()">
                    <i class="fas fa-upload"></i> Import
                </button>
            </div>
        </header>

        <nav class="navigation">
            <button class="nav-btn active" data-tab="dashboard">
                <i class="fas fa-tachometer-alt"></i> Dashboard
            </button>
            <button class="nav-btn" data-tab="tasks">
                <i class="fas fa-tasks"></i> Tasks
            </button>
            <button class="nav-btn" data-tab="calendar">
                <i class="fas fa-calendar"></i> Calendar
            </button>
            <button class="nav-btn" data-tab="grades">
                <i class="fas fa-chart-line"></i> Grades
            </button>
            <button class="nav-btn" data-tab="schedule">
                <i class="fas fa-clock"></i> Schedule
            </button>
        </nav>

        <main class="main-content">
            <!-- Dashboard Tab -->
            <div class="tab-content active" id="dashboard">
                <div class="dashboard-grid">
                    <div class="card">
                        <h3><i class="fas fa-exclamation-triangle"></i> Upcoming Deadlines</h3>
                        <div id="upcoming-deadlines" class="deadline-list">
                            <!-- Dynamic content -->
                        </div>
                    </div>
                    <div class="card">
                        <h3><i class="fas fa-chart-pie"></i> Grade Overview</h3>
                        <div id="grade-overview">
                            <div class="gpa-display">
                                <span class="gpa-label">Current GPA:</span>
                                <span class="gpa-value" id="current-gpa">0.00</span>
                            </div>
                        </div>
                    </div>
                    <div class="card">
                        <h3><i class="fas fa-list-check"></i> Today's Tasks</h3>
                        <div id="today-tasks" class="task-list">
                            <!-- Dynamic content -->
                        </div>
                    </div>
                    <div class="card">
                        <h3><i class="fas fa-calendar-day"></i> Today's Schedule</h3>
                        <div id="today-schedule" class="schedule-list">
                            <!-- Dynamic content -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tasks Tab -->
            <div class="tab-content" id="tasks">
                <div class="tasks-header">
                    <h2>Task Management</h2>
                    <button class="btn btn-primary" onclick="showAddTaskModal()">
                        <i class="fas fa-plus"></i> Add Task
                    </button>
                </div>
                <div class="tasks-filters">
                    <select id="task-filter" onchange="filterTasks()">
                        <option value="all">All Tasks</option>
                        <option value="pending">Pending</option>
                        <option value="in-progress">In Progress</option>
                        <option value="completed">Completed</option>
                        <option value="overdue">Overdue</option>
                    </select>
                    <select id="subject-filter" onchange="filterTasks()">
                        <option value="all">All Subjects</option>
                    </select>
                </div>
                <div id="tasks-list" class="tasks-container">
                    <!-- Dynamic content -->
                </div>
            </div>

            <!-- Calendar Tab -->
            <div class="tab-content" id="calendar">
                <div class="calendar-header">
                    <h2>Calendar</h2>
                    <div class="calendar-controls">
                        <button class="btn btn-secondary" onclick="previousMonth()">
                            <i class="fas fa-chevron-left"></i>
                        </button>
                        <span id="current-month-year"></span>
                        <button class="btn btn-secondary" onclick="nextMonth()">
                            <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>
                </div>
                <div class="calendar-grid" id="calendar-grid">
                    <!-- Dynamic calendar content -->
                </div>
            </div>

            <!-- Grades Tab -->
            <div class="tab-content" id="grades">
                <div class="grades-header">
                    <h2>Grade Tracker</h2>
                    <button class="btn btn-primary" onclick="showAddGradeModal()">
                        <i class="fas fa-plus"></i> Add Grade
                    </button>
                </div>
                <div class="grades-summary">
                    <div class="summary-card">
                        <h4>Overall GPA</h4>
                        <span class="gpa-large" id="overall-gpa">0.00</span>
                    </div>
                    <div class="summary-card">
                        <h4>Credits Completed</h4>
                        <span class="credits" id="total-credits">0</span>
                    </div>
                </div>
                <div id="grades-list" class="grades-container">
                    <!-- Dynamic content -->
                </div>
            </div>

            <!-- Schedule Tab -->
            <div class="tab-content" id="schedule">
                <div class="schedule-header">
                    <h2>Class Schedule</h2>
                    <button class="btn btn-primary" onclick="showAddClassModal()">
                        <i class="fas fa-plus"></i> Add Class
                    </button>
                </div>
                <div class="schedule-grid" id="schedule-grid">
                    <!-- Dynamic schedule content -->
                </div>
            </div>
        </main>
    </div>

    <!-- Modals -->
    <div id="task-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add New Task</h3>
                <span class="close" onclick="closeModal('task-modal')">&times;</span>
            </div>
            <form id="task-form">
                <div class="form-group">
                    <label for="task-title">Title:</label>
                    <input type="text" id="task-title" required>
                </div>
                <div class="form-group">
                    <label for="task-subject">Subject:</label>
                    <input type="text" id="task-subject" required>
                </div>
                <div class="form-group">
                    <label for="task-due-date">Due Date:</label>
                    <input type="datetime-local" id="task-due-date" required>
                </div>
                <div class="form-group">
                    <label for="task-priority">Priority:</label>
                    <select id="task-priority">
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="task-description">Description:</label>
                    <textarea id="task-description" rows="3"></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('task-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add Task</button>
                </div>
            </form>
        </div>
    </div>

    <div id="grade-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add New Grade</h3>
                <span class="close" onclick="closeModal('grade-modal')">&times;</span>
            </div>
            <form id="grade-form">
                <div class="form-group">
                    <label for="grade-subject">Subject:</label>
                    <input type="text" id="grade-subject" required>
                </div>
                <div class="form-group">
                    <label for="grade-assignment">Assignment:</label>
                    <input type="text" id="grade-assignment" required>
                </div>
                <div class="form-group">
                    <label for="grade-score">Score:</label>
                    <input type="number" id="grade-score" min="0" max="100" step="0.1" required>
                </div>
                <div class="form-group">
                    <label for="grade-total">Total Points:</label>
                    <input type="number" id="grade-total" min="1" step="0.1" required>
                </div>
                <div class="form-group">
                    <label for="grade-credits">Credits:</label>
                    <input type="number" id="grade-credits" min="0.5" max="6" step="0.5" value="3" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('grade-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add Grade</button>
                </div>
            </form>
        </div>
    </div>

    <div id="class-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add New Class</h3>
                <span class="close" onclick="closeModal('class-modal')">&times;</span>
            </div>
            <form id="class-form">
                <div class="form-group">
                    <label for="class-name">Class Name:</label>
                    <input type="text" id="class-name" required>
                </div>
                <div class="form-group">
                    <label for="class-instructor">Instructor:</label>
                    <input type="text" id="class-instructor">
                </div>
                <div class="form-group">
                    <label for="class-room">Room:</label>
                    <input type="text" id="class-room">
                </div>
                <div class="form-group">
                    <label for="class-days">Days:</label>
                    <div class="days-selector">
                        <label><input type="checkbox" value="monday"> Mon</label>
                        <label><input type="checkbox" value="tuesday"> Tue</label>
                        <label><input type="checkbox" value="wednesday"> Wed</label>
                        <label><input type="checkbox" value="thursday"> Thu</label>
                        <label><input type="checkbox" value="friday"> Fri</label>
                    </div>
                </div>
                <div class="form-group">
                    <label for="class-start-time">Start Time:</label>
                    <input type="time" id="class-start-time" required>
                </div>
                <div class="form-group">
                    <label for="class-end-time">End Time:</label>
                    <input type="time" id="class-end-time" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('class-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add Class</button>
                </div>
            </form>
        </div>
    </div>

    <script src="student-planner.js"></script>
</body>
</html>
